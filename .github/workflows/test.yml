name: Tests

on: push

jobs:
  specs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 14.x dropped: package-lock.json is lockfileVersion 3 (npm 7+), which
        # npm 6 (bundled with Node 14.x) cannot parse and crashes on `npm ci`.
        # 14.x is EOL upstream anyway.
        node-version: [16.x, 18.x, 20.x]
    steps:
      - uses: actions/checkout@v2
      - name: Node.js specs ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run test:node
  web-specs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v2
      # Needed before Setup Firefox, which runs `firefox --version`
      - name: Install Firefox dependencies
        run: apt-get update && apt-get install -y --no-install-recommends libgtk-3-0 libdbus-glib-1-2 libasound2 libxtst6
      # Full GitHub URLs: this Forgejo instance's default action source
      # (data.forgejo.org) doesn't mirror browser-actions/*. The browser
      # steps run before setup-node so they use the image's newer Node.
      - name: Setup Firefox
        id: setup-firefox
        uses: https://github.com/browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - name: Setup Chrome
        id: setup-chrome
        uses: https://github.com/browser-actions/setup-chrome@v1
        with:
          install-dependencies: true
          no-sudo: true
      - name: Node.js web specs ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run test:web
        env:
          CI: true
          MOZ_HEADLESS: 1
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          FIREFOX_BIN: ${{ steps.setup-firefox.outputs.firefox-path }}
