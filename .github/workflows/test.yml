name: Tests

on: push

jobs:
  specs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 14.x dropped: package-lock.json is lockfileVersion 3 (npm 7+), which
        # npm 6 (bundled with Node 14.x) cannot parse and crashes on `npm ci`.
        # 14.x is EOL upstream anyway.
        node-version: [16.x, 18.x, 20.x]
    steps:
      - uses: actions/checkout@v2
      - name: Node.js specs ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run test:node
  web-specs:
    runs-on: ubuntu-latest
    # TODO: remove continue-on-error once GitHub is restored / off Forgejo.
    # This Forgejo instance's action source (data.forgejo.org) doesn't mirror
    # browser-actions/*, so Setup Firefox/Chrome fail immediately with
    # "repository not found" - not a real test failure.
    continue-on-error: true
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v2
      - name: Node.js web specs ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
        env:
          MOZ_HEADLESS: 1
          CI: travis
      - name: Setup Firefox
        uses: browser-actions/setup-firefox@latest
        with:
          firefox-version: latest
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest
      - run: google-chrome-stable --headless --disable-gpu --remote-debugging-port=9222 http://localhost &
      - run: npm ci
      - run: npm run test:web
