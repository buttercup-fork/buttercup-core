name: Tests

on: push

jobs:
  specs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Supported Node versions: see "engines" in package.json
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v5
      - name: Node.js specs ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:node
  web-specs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v5
      # Full GitHub URL: this Forgejo instance's default action source
      # (data.forgejo.org) doesn't mirror browser-actions/*. Runs before
      # setup-node so it uses the image's newer Node.
      - name: Setup Chrome
        id: setup-chrome
        uses: https://github.com/browser-actions/setup-chrome@v1
        with:
          install-dependencies: true
          no-sudo: true
      - name: Node.js web specs ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Playwright's Firefox build, plus the system libraries it needs (the
      # runner image has no desktop libraries)
      - run: npx playwright install --with-deps firefox
      - run: npm run test:web
        env:
          CI: true
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
