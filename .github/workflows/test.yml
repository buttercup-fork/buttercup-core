name: Tests

# Branches only: pushing a tag shouldn't start a run of its own
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  specs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Supported Node versions: see "engines" in package.json
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v5
      - name: Node.js specs ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:node
  web-specs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v5
      # Runs before setup-node so it uses the image's newer Node. A short
      # name works on both GitHub and our Forgejo (its default action
      # source is github.com).
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-dependencies: true
          # The Forgejo runner is root and has no sudo; GitHub's runner needs it
          no-sudo: ${{ github.server_url != 'https://github.com' }}
      - name: Node.js web specs ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Playwright's Firefox build, plus the system libraries it needs (the
      # runner image has no desktop libraries)
      - run: npx playwright install --with-deps firefox
      - run: npm run test:web
        env:
          CI: true
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
