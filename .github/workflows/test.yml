name: Tests

on: push

jobs:
  specs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Supported Node versions: see "engines" in package.json
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v2
      - name: Node.js specs ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run test:node
  web-specs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v2
      # Needed before Setup Firefox, which runs `firefox --version`.
      # Package names are for the runner image's Ubuntu 24.04 (t64 renames)
      - name: Install Firefox dependencies
        run: apt-get update && apt-get install -y --no-install-recommends libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libxtst6
      # Full GitHub URLs: this Forgejo instance's default action source
      # (data.forgejo.org) doesn't mirror browser-actions/*. The browser
      # steps run before setup-node so they use the image's newer Node.
      - name: Setup Firefox
        id: setup-firefox
        uses: https://github.com/browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - name: Setup Chrome
        id: setup-chrome
        uses: https://github.com/browser-actions/setup-chrome@v1
        with:
          install-dependencies: true
          no-sudo: true
      - name: Node.js web specs ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run test:web
        env:
          CI: true
          MOZ_HEADLESS: 1
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          FIREFOX_BIN: ${{ steps.setup-firefox.outputs.firefox-path }}
